name: Supabase Keep-Alive

# פונה ל-Supabase כל יומיים כדי שהפרויקט לא ייכנס להשהיה אוטומטית
# בשל חוסר פעילות (שכבה חינמית).
#
# הבקשה קוראת לפונקציית RPC בשם keep_alive() (ראו supabase-keepalive-function.sql).
# הפונקציה לא נוגעת בשום טבלה של מתכונים/קטגוריות - היא רק מחזירה את
# הזמן הנוכחי של השרת. ל-role anon יש הרשאת EXECUTE אך ורק על הפונקציה
# הזו, ואין לו שום הרשאה על אף טבלה. זו הסיבה שהבקשה מצליחה (200) בלי
# לפתוח גישה לנתונים ובלי להשתמש במפתח service_role או בסיסמת מסד הנתונים.

on:
  schedule:
    - cron: "0 6 */2 * *" # כל יומיים בשעה 06:00 UTC
  workflow_dispatch: {} # מאפשר גם הפעלה ידנית מלשונית Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keep_alive() RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "חסרים secrets בשם SUPABASE_URL ו-SUPABASE_ANON_KEY בהגדרות הריפו."
            exit 1
          fi

          response_file=$(mktemp)
          status=$(curl -sS -o "$response_file" -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP status: ${status}"
          echo "Response body: $(cat "$response_file")"

          if [ "$status" != "200" ]; then
            echo "צפוי היה סטטוס 200 מקריאה ל-keep_alive(). ודאו שהפונקציה וההרשאות קיימות (supabase-keepalive-function.sql)."
            exit 1
          fi
